<template id="svg-atp">
<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="260" fill="#fff"/>
  <!-- adenine: fused 6+5 rings -->
  <polygon points="60,110 90,93 120,110 120,145 90,162 60,145" fill="#cfe0ff" stroke="#2b5cd6" stroke-width="3"/>
  <polygon points="120,110 150,100 168,127 150,155 120,145" fill="#cfe0ff" stroke="#2b5cd6" stroke-width="3"/>
  <text x="105" y="196" text-anchor="middle" fill="#2b5cd6" font-size="17" font-weight="bold">Adenine</text>
  <line x1="168" y1="127" x2="205" y2="127" stroke="#444" stroke-width="3"/>
  <!-- ribose: pentagon -->
  <polygon points="235,95 268,118 256,158 214,158 202,118" fill="#d4f2d2" stroke="#2e9d3a" stroke-width="3"/>
  <text x="235" y="196" text-anchor="middle" fill="#2e9d3a" font-size="17" font-weight="bold">Ribose</text>
  <line x1="268" y1="118" x2="305" y2="118" stroke="#444" stroke-width="3"/>
  <!-- phosphates -->
  <g font-weight="bold">
  <circle cx="330" cy="118" r="24" fill="#f7a23b"/><text x="330" y="125" text-anchor="middle" fill="#fff" font-size="20">P</text>
  <line x1="354" y1="118" x2="386" y2="118" stroke="#444" stroke-width="3"/>
  <circle cx="410" cy="118" r="24" fill="#f7a23b"/><text x="410" y="125" text-anchor="middle" fill="#fff" font-size="20">P</text>
  <line x1="434" y1="118" x2="452" y2="118" stroke="#444" stroke-width="3"/>
  <line x1="462" y1="118" x2="482" y2="118" stroke="#444" stroke-width="3" stroke-dasharray="4 4"/>
  <circle cx="512" cy="118" r="24" fill="#f7a23b"/><text x="512" y="125" text-anchor="middle" fill="#fff" font-size="20">P</text>
  </g>
  <text x="330" y="166" text-anchor="middle" font-size="18" fill="#a85b00">α</text>
  <text x="410" y="166" text-anchor="middle" font-size="18" fill="#a85b00">β</text>
  <text x="512" y="166" text-anchor="middle" font-size="18" fill="#a85b00">γ</text>
  <!-- spark at beta-gamma -->
  <g transform="translate(457,92)" fill="#ffcf2e" stroke="#e0a400" stroke-width="1.5">
    <polygon points="0,-16 5,-4 16,-6 7,3 12,14 0,7 -12,14 -7,3 -16,-6 -5,-4"/>
  </g>
  <!-- brackets -->
  <g stroke="#666" stroke-width="2" fill="none">
    <path d="M60,62 v-10 h208 v10"/>
    <path d="M60,222 v10 h298 v-10"/>
    <path d="M60,246 v6 h378 v-6" stroke="#999"/>
  </g>
  <text x="164" y="44" text-anchor="middle" font-size="15" fill="#444">Adenosine</text>
  <text x="372" y="248" text-anchor="start" font-size="13" fill="#444">AMP</text>
  <text x="446" y="256" text-anchor="start" font-size="13" fill="#444">ADP</text>
  <text x="560" y="84" text-anchor="middle" font-size="14" fill="#444">+ H2O</text>
  <text x="575" y="160" text-anchor="middle" font-size="14" fill="#444">→ ADP + Pi</text>
  <text x="575" y="180" text-anchor="middle" font-size="13" fill="#777">(energy)</text>
</svg>
</template>
